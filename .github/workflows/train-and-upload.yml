name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn torch huggingface_hub

      - name: Create training script
        run: |
          cat > train.py << 'EOF'
          import pandas as pd
          import numpy as np
          import pickle
          import torch
          import torch.nn as nn
          import torch.optim as optim
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.model_selection import train_test_split
          from sklearn.metrics import accuracy_score
          from sklearn.preprocessing import LabelEncoder

          reviews = [
              "This movie is great! I loved it",
              "Terrible film, waste of time",
              "Amazing acting and story",
              "Boring and too long",
              "Best movie ever seen",
              "Worst film ever",
              "Good plot and characters",
              "Disappointing ending",
              "Fantastic cinematography",
              "Awful dialogue"
          ]
          sentiments = ["positive", "negative", "positive", "negative", "positive", 
                        "negative", "positive", "negative", "positive", "negative"]

          df = pd.DataFrame({'review': reviews, 'sentiment': sentiments})

          le = LabelEncoder()
          y_encoded = le.fit_transform(df['sentiment'])
          with open('classes.pkl', 'wb') as f:
              pickle.dump(le.classes_, f)

          vectorizer = TfidfVectorizer(max_features=100)
          X_tfidf = vectorizer.fit_transform(df['review']).toarray().astype(np.float32)
          with open('tfidf_vectorizer.pkl', 'wb') as f:
              pickle.dump(vectorizer, f)

          class SimpleNN(nn.Module):
              def __init__(self, input_dim):
                  super().__init__()
                  self.net = nn.Sequential(
                      nn.Linear(input_dim, 64),
                      nn.ReLU(),
                      nn.Linear(64, 2)
                  )
              def forward(self, x):
                  return self.net(x)

          model = SimpleNN(X_tfidf.shape[1])
          criterion = nn.CrossEntropyLoss()
          optimizer = optim.Adam(model.parameters(), lr=0.01)

          X_tensor = torch.tensor(X_tfidf)
          y_tensor = torch.tensor(y_encoded)

          for epoch in range(50):
              optimizer.zero_grad()
              outputs = model(X_tensor)
              loss = criterion(outputs, y_tensor)
              loss.backward()
              optimizer.step()

          torch.save(model.state_dict(), 'model_weights.pth')
          print("Model trained and saved successfully!")
          EOF

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - << 'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = "Liyz510/imdb-sentiment-model"

          api = HfApi()
          api.create_repo(repo_id, token=token, exist_ok=True)

          files = ["model_weights.pth", "tfidf_vectorizer.pkl", "classes.pkl"]
          for file in files:
              if os.path.exists(file):
                  api.upload_file(
                      path_or_fileobj=file,
                      path_in_repo=file,
                      repo_id=repo_id,
                      token=token,
                  )
                  print(f"Uploaded {file}")

          print(f"Model uploaded to https://huggingface.co/{repo_id}")
          EOF
