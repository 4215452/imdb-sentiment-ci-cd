name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn torch huggingface_hub

      - name: Train model and save files
        run: |
          python << 'PYTHON_SCRIPT'
          import pickle
          import numpy as np
          import torch
          import torch.nn as nn
          import torch.optim as optim
          from sklearn.feature_extraction.text import TfidfVectorizer
          from sklearn.preprocessing import LabelEncoder
          import os

          # 1. 准备数据
          texts = [
              "This movie is fantastic! I loved every minute.",
              "Worst film ever made, complete waste of time.",
              "Great acting and beautiful cinematography.",
              "Terrible plot and boring characters.",
              "Absolutely amazing, would watch again!",
              "Disappointing and forgettable.",
              "Brilliant story telling!",
              "Not worth the money."
          ]
          labels = ["positive", "negative", "positive", "negative", 
                    "positive", "negative", "positive", "negative"]

          # 2. TF-IDF 特征提取
          vectorizer = TfidfVectorizer(max_features=100)
          X = vectorizer.fit_transform(texts).toarray()
          
          # 3. 标签编码
          le = LabelEncoder()
          y = le.fit_transform(labels)
          
          # 4. 保存预处理对象
          with open('tfidf_vectorizer.pkl', 'wb') as f:
              pickle.dump(vectorizer, f)
          
          with open('classes.pkl', 'wb') as f:
              pickle.dump(le.classes_, f)
          
          print("✓ Preprocessing files saved")
          print(f"  - tfidf_vectorizer.pkl ({os.path.getsize('tfidf_vectorizer.pkl')} bytes)")
          print(f"  - classes.pkl ({os.path.getsize('classes.pkl')} bytes)")

          # 5. 创建神经网络模型
          class SentimentNN(nn.Module):
              def __init__(self, input_dim, hidden_dim=32, output_dim=2):
                  super().__init__()
                  self.network = nn.Sequential(
                      nn.Linear(input_dim, hidden_dim),
                      nn.ReLU(),
                      nn.Dropout(0.2),
                      nn.Linear(hidden_dim, output_dim),
                      nn.LogSoftmax(dim=1)
                  )
              
              def forward(self, x):
                  return self.network(x)

          # 6. 训练模型
          model = SentimentNN(input_dim=X.shape[1])
          criterion = nn.NLLLoss()
          optimizer = optim.Adam(model.parameters(), lr=0.01)
          
          X_tensor = torch.tensor(X, dtype=torch.float32)
          y_tensor = torch.tensor(y, dtype=torch.long)
          
          # 训练 200 个 epoch
          for epoch in range(200):
              optimizer.zero_grad()
              outputs = model(X_tensor)
              loss = criterion(outputs, y_tensor)
              loss.backward()
              optimizer.step()
              
              if (epoch + 1) % 50 == 0:
                  print(f"Epoch {epoch+1}/200, Loss: {loss.item():.4f}")
          
          # 7. 保存模型权重
          torch.save(model.state_dict(), 'model_weights.pth')
          print(f"✓ Model saved: model_weights.pth ({os.path.getsize('model_weights.pth')} bytes)")
          print("\n🎉 Training complete! All files generated successfully.")
          PYTHON_SCRIPT

      - name: Verify files exist
        run: |
          echo "Checking generated files:"
          ls -lh *.pth *.pkl 2>/dev/null || echo "ERROR: No model files found!"
          echo ""
          echo "Current directory contents:"
          ls -la

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'UPLOAD_SCRIPT'
          import os
          import sys
          from huggingface_hub import HfApi

          token = os.environ.get('HF_TOKEN')
          if not token:
              print("❌ ERROR: HF_TOKEN environment variable not set")
              sys.exit(1)
          
          repo_id = "Liyz510/imdb-sentiment-model"
          print(f"📤 Uploading to: {repo_id}")
          
          api = HfApi()
          
          # 创建或获取仓库
          try:
              api.create_repo(repo_id, token=token, exist_ok=True)
              print("✓ Repository ready")
          except Exception as e:
              print(f"⚠️  Repo creation issue (may already exist): {e}")
          
          # 要上传的文件列表
          files_to_upload = [
              "model_weights.pth",
              "tfidf_vectorizer.pkl", 
              "classes.pkl"
          ]
          
          uploaded_count = 0
          for file_name in files_to_upload:
              if os.path.exists(file_name):
                  print(f"  Uploading {file_name}...")
                  try:
                      api.upload_file(
                          path_or_fileobj=file_name,
                          path_in_repo=file_name,
                          repo_id=repo_id,
                          token=token,
                      )
                      print(f"  ✓ {file_name} uploaded")
                      uploaded_count += 1
                  except Exception as e:
                      print(f"  ✗ Failed to upload {file_name}: {e}")
              else:
                  print(f"  ✗ {file_name} not found locally")
          
          print(f"\n{'='*50}")
          print(f"📊 Upload Summary: {uploaded_count}/{len(files_to_upload)} files uploaded")
          print(f"🔗 View at: https://huggingface.co/{repo_id}/tree/main")
          print(f"{'='*50}")
          
          if uploaded_count == 0:
              print("❌ ERROR: No files were uploaded!")
              sys.exit(1)
          UPLOAD_SCRIPT

      - name: Final status
        run: |
          echo "✅ Workflow completed successfully"
          echo "Check your model at: https://huggingface.co/Liyz510/imdb-sentiment-model/tree/main"
